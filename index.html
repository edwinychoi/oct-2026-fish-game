<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fish Game</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }
  /* Full-viewport tank: white above, water (the background image's colors)
     edge to edge below. The waterline sits at the background's proportion,
     1548/4804 = 32.2% down, so the top white space is always over 30%. */
  .stage {
    position: fixed;
    inset: 0;
    background: #ffffff;
    overflow: hidden;
    touch-action: manipulation; /* taps respond immediately, no double-tap zoom */
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    --u: 405px; /* size unit, set from script; see sizeUnit() */
    --fish-scale: 1; /* shrinks the fish on small screens so they all fit without overlapping */
  }
  /* The water is drawn on a canvas so its surface can ripple: one flat color
     (#abd2ff, from the background image), no outlines or highlights. */
  .water {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  /* Same as the bubbles in background.png: 76px circles on the 2164px-wide image,
     either solid white or white at 50% (which reads as #d5e8ff on the water). */
  .bubble {
    position: absolute;
    left: 0;
    top: 0;
    width: calc(var(--u) * 76 / 2164);
    aspect-ratio: 1;
    border-radius: 50%;
    background: #ffffff;
    pointer-events: none;
    will-change: transform, opacity;
  }
  /* Fish food: tiny flat flakes, no outlines or shading, like the bubbles. */
  .flake {
    position: absolute;
    left: 0;
    top: 0;
    width: calc(var(--u) * 30 / 2164);
    height: calc(var(--u) * 22 / 2164);
    border-radius: calc(var(--u) * 5 / 2164);
    pointer-events: none;
    will-change: transform, opacity;
  }
  /* Feeding log: small plain text in the white space above the water. New lines
     appear at the bottom, older ones move up and fade out through the top. */
  .log {
    position: absolute;
    left: 0;
    right: 0;
    top: 48px; /* below the "tap to feed" hint */
    height: 0; /* set from script: ends a safe distance above the highest wave */
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 0 clamp(16px, 4vw, 48px); /* keep clear of the window's left edge */
    box-sizing: border-box;
    overflow: hidden;
    pointer-events: none;
    font: 500 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 40%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 40%);
  }
  /* Permanent hint, top left, lined up with the log's left margin. */
  .hint {
    position: absolute;
    top: clamp(14px, 2.5vh, 28px);
    left: clamp(16px, 4vw, 48px);
    z-index: 1; /* above the log's fade */
    pointer-events: none;
    font: 500 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #94a3b8;
  }
  /* Tap demo: a faint hand taps the middle of the white space and a few pale flakes
     sprinkle down. It fades away after the first real tap. */
  .tap-demo {
    position: absolute;
    left: 50%;
    top: calc(100% * 1548 / 4804 * 0.42); /* the tap point */
    width: 0;
    height: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .tap-demo.is-done { opacity: 0; }
  .tap-hand {
    position: absolute;
    left: -9px;
    top: -1px;
    width: 34px;
    transform-origin: 9px 1px;
    animation: tap-press 2.8s ease-in-out infinite;
  }
  .tap-ring {
    position: absolute;
    left: -14px;
    top: -14px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #cbd5e1;
    opacity: 0;
    animation: tap-ring 2.8s ease-out infinite;
  }
  .tap-flake {
    position: absolute;
    left: 0;
    top: 0;
    width: 6px;
    height: 4px;
    border-radius: 1px;
    background: #f6b26b;
    opacity: 0;
    animation: tap-flake 2.8s ease-in infinite;
  }
  .tap-flake:nth-child(3) { --dx: -24px; --spin: -70deg; animation-delay: 0.05s; }
  .tap-flake:nth-child(4) { --dx: -11px; --spin: 50deg; }
  .tap-flake:nth-child(5) { --dx: -34px; --spin: 110deg; animation-delay: 0.12s; }
  @keyframes tap-press {
    0%, 12% { transform: translate(6px, 10px) rotate(-18deg); }
    24% { transform: translate(0, 0) rotate(-18deg) scale(0.92); }
    32% { transform: translate(0, 0) rotate(-18deg); }
    55%, 100% { transform: translate(6px, 10px) rotate(-18deg); }
  }
  @keyframes tap-ring {
    0%, 22% { opacity: 0; transform: scale(0.2); }
    26% { opacity: 0.45; }
    55%, 100% { opacity: 0; transform: scale(1.4); }
  }
  @keyframes tap-flake {
    0%, 26% { opacity: 0; transform: translate(0, 0) rotate(0); }
    32% { opacity: 0.45; }
    72% { opacity: 0.3; }
    86%, 100% { opacity: 0; transform: translate(var(--dx), 54px) rotate(var(--spin)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tap-hand, .tap-ring, .tap-flake { animation: none; }
    .tap-ring, .tap-flake { display: none; }
  }
  .log-line {
    flex-shrink: 0; /* never squeeze lines; extra ones scroll out of the top instead */
    white-space: nowrap;
    overflow: hidden;
    animation: log-in 0.25s ease-out both;
    transition: opacity 0.8s ease;
  }
  .log-line.is-fading { opacity: 0; }
  @keyframes log-in {
    from { opacity: 0; max-height: 0; }
    to { opacity: 1; max-height: 1.5em; }
  }
  .fish {
    position: absolute;
    left: 0;
    top: 0;
    height: auto;
    will-change: transform;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas class="water" id="water"></canvas>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="hint">tap to feed</div>
    <div class="tap-demo" id="tap-demo" aria-hidden="true">
      <!-- A flat pointing hand; the tip of the index finger is the tap point. -->
      <svg class="tap-hand" viewBox="0 0 24 30" fill="#cbd5e1">
        <rect x="6.5" y="0" width="5" height="16" rx="2.5"/>
        <rect x="4" y="11" width="16" height="15" rx="6"/>
        <rect x="11" y="9" width="4.5" height="9" rx="2.25"/>
        <rect x="15" y="10.5" width="4.5" height="8" rx="2.25"/>
        <rect x="0.5" y="14" width="5" height="9" rx="2.5" transform="rotate(-25 3 18.5)"/>
      </svg>
      <div class="tap-ring"></div>
      <div class="tap-flake"></div>
      <div class="tap-flake"></div>
      <div class="tap-flake"></div>
    </div>
  </div>
<script>
  // Everyone in the tank. Each fish's frames are small pre-cut sprites in fish/
  // (made from the original photos in images/, which stay unchanged): frame 1 is
  // the normal face, the rest are chomp frames.
  //   chomp     order of frames (indexes into `frames`) cycled while eating
  //   width     on-screen width in size units (heads sized to match Diego's;
  //             Stella is 10% smaller and Edwin 10% bigger)
  //   aspect    height / width of the sprites
  //   mouthX/Y  mouth position, as shares of the sprite's width/height
  //   headTopX  where bubbles rise from, as a share of the sprite's width
  const FISH = [
    { name: "diego", frames: [1, 2, 3, 4], chomp: [3, 2, 1, 2], width: 0.2797, aspect: 1.2296, mouthX: 0.4965, mouthY: 0.7648, headTopX: 0.5763 },
    { name: "charles", frames: [1, 2, 3, 4], chomp: [1, 2, 3, 2], width: 0.2221, aspect: 1.4772, mouthX: 0.4226, mouthY: 0.8017, headTopX: 0.5211 },
    { name: "grace", frames: [1, 2, 3, 4], chomp: [1, 2, 3, 2], width: 0.2241, aspect: 1.517, mouthX: 0.4806, mouthY: 0.7736, headTopX: 0.498 },
    { name: "iris", frames: [1, 2, 3], chomp: [1, 2], width: 0.3536, aspect: 1.1948, mouthX: 0.5213, mouthY: 0.6225, headTopX: 0.472 },
    { name: "keith", frames: [1, 2, 3], chomp: [1, 2], width: 0.2425, aspect: 1.4301, mouthX: 0.4299, mouthY: 0.7585, headTopX: 0.4974 },
    { name: "liam", frames: [1, 2, 3], chomp: [1, 2], width: 0.253, aspect: 1.2636, mouthX: 0.475, mouthY: 0.8226, headTopX: 0.5498 },
    { name: "stella", frames: [1, 3], chomp: [1, 0], width: 0.3367, aspect: 1.0059, mouthX: 0.5137, mouthY: 0.6989, headTopX: 0.5001 },
    { name: "edwin", frames: [1, 2], chomp: [1, 0], width: 0.2316, aspect: 1.4974, mouthX: 0.3416, mouthY: 0.8342, headTopX: 0.7653 },
    { name: "emily", frames: [1, 2], chomp: [1, 0], width: 0.3238, aspect: 1.3888, mouthX: 0.5095, mouthY: 0.5849, headTopX: 0.4637 },
    { name: "lu", frames: [1, 2], chomp: [1, 0], width: 0.3632, aspect: 1.1215, mouthX: 0.4993, mouthY: 0.6457, headTopX: 0.4553 },
    { name: "peter", frames: [1, 2, 3, 4], chomp: [1, 2, 3, 2], width: 0.2757, aspect: 1.2766, mouthX: 0.4486, mouthY: 0.7472, headTopX: 0.5287 },
    { name: "lily", frames: [1, 2, 3], chomp: [1, 2], width: 0.254, aspect: 1.4361, mouthX: 0.5156, mouthY: 0.721, headTopX: 0.5448 },
  ];

  // Proportions from background.png (2164 x 4804): the water starts at row 1548.
  const IMG_W = 2164, IMG_H = 4804;
  const WATERLINE = 1548 / IMG_H;

  const stage = document.getElementById("stage");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Fish and bubbles are sized against the width the original portrait background
  // would have on this screen, so they stay the same size on any viewport.
  function sizeUnit() {
    return Math.min(stage.clientWidth, (stage.clientHeight * IMG_W) / IMG_H);
  }
  const scale = () => sizeUnit() / IMG_W; // image px -> screen px
  function applySize() {
    const u = sizeUnit();
    stage.style.setProperty("--u", `${u}px`);
    // Make sure there's room to spread out: keep the heads' combined area under
    // half the water, shrinking them on small screens if needed.
    const water = stage.clientWidth * stage.clientHeight * (1 - WATERLINE);
    const heads = fishes.reduce((sum, f) => sum + f.look.width * f.look.width * f.look.aspect, 0) * u * u;
    const fit = heads ? Math.min(1, Math.sqrt((water / 2) / heads)) : 1;
    stage.style.setProperty("--fish-scale", fit.toFixed(3));
    resizeWater();
    // The log stays in the white space: it ends above the highest a wave can rise.
    logEl.style.height = `${Math.max(0, stage.clientHeight * WATERLINE - maxWave() - 12 - logEl.offsetTop)}px`;
  }

  // ---------------------------------------------------------------------------
  // Feeding log: "Fish fed on <date>" when a round of feeding starts, then a line
  // per bite with that fish's running count, each in their own color.
  // ---------------------------------------------------------------------------

  const logEl = document.getElementById("log");
  const LOG_COLORS = {
    diego: "#c2410c", charles: "#2f7d32", grace: "#be185d",
    iris: "#6d28d9", keith: "#1d4ed8", liam: "#a16207",
    stella: "#0f766e", edwin: "#4d7c0f", emily: "#a21caf",
    lu: "#b91c1c", peter: "#0369a1", lily: "#9d174d",
  };
  const FED_COLOR = "#64748b";
  const LOG_SHOW_MS = 3500;   // how long a line stays before fading
  const NEW_ROUND_MS = 4000;  // a bite after this much quiet starts a new feeding round
  const bitesBy = {};
  let lastBiteAt = -Infinity;

  function logLine(text, color) {
    const line = document.createElement("div");
    line.className = "log-line";
    line.textContent = text;
    line.style.color = color;
    logEl.appendChild(line);
    setTimeout(() => line.classList.add("is-fading"), LOG_SHOW_MS);
    setTimeout(() => line.remove(), LOG_SHOW_MS + 900);
  }

  function recordBite(fish, now) {
    if (now - lastBiteAt > NEW_ROUND_MS) {
      const date = new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
      logLine(`Fish fed on ${date}`, FED_COLOR);
    }
    lastBiteAt = now;
    const name = fish.look.name;
    bitesBy[name] = (bitesBy[name] || 0) + 1;
    logLine(`${name[0].toUpperCase()}${name.slice(1)} ate ${bitesBy[name]} food`, LOG_COLORS[name] || FED_COLOR);
  }

  // ---------------------------------------------------------------------------
  // Water surface: a row of small springs along the waterline. Fast movement near
  // the surface pushes it, the ripple spreads sideways, then settles flat again.
  // ---------------------------------------------------------------------------

  const waterCanvas = document.getElementById("water");
  const waterCtx = waterCanvas.getContext("2d");
  const WATER_COLOR = "#abd2ff";
  const SPACING = 10;       // px between surface points
  const STIFFNESS = 0.02;   // pull back to flat
  const DAMPING = 0.04;     // how quickly ripples die down
  const SPREAD = 0.22;      // how much each point drags its neighbors
  const surface = { h: new Float32Array(0), v: new Float32Array(0), drawnFlat: false };
  // The biggest the surface ever moves, in px (scales with the scene). Only a crowd
  // rushing the surface gets near this; one fish or a few flakes stay well below it.
  const maxWave = () => Math.max(8, sizeUnit() * 0.07);

  function resizeWater() {
    const W = stage.clientWidth, H = stage.clientHeight, dpr = window.devicePixelRatio || 1;
    waterCanvas.width = Math.round(W * dpr);
    waterCanvas.height = Math.round(H * dpr);
    waterCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.ceil(W / SPACING) + 2;
    if (surface.h.length !== n) {
      surface.h = new Float32Array(n);
      surface.v = new Float32Array(n);
    }
    surface.drawnFlat = false;
    drawWater();
  }

  // Push the surface down at screen position x (amount in px per frame).
  function disturb(x, amount) {
    const i = Math.round(x / SPACING), { v } = surface;
    for (let k = -2; k <= 2; k++) {
      if (i + k >= 0 && i + k < v.length) v[i + k] += amount * (1 - Math.abs(k) * 0.3);
    }
  }

  function updateSurface(dt) {
    const { h, v } = surface, n = h.length, limit = maxWave();
    // Crests may never rise past the 30% line, so the top white space stays over 30%.
    const H = stage.clientHeight;
    const up = Math.max(1, Math.min(limit, H * WATERLINE - H * 0.3 - 1));
    const steps = Math.min(4, Math.max(1, Math.round(dt * 60)));
    const left = new Float32Array(n), right = new Float32Array(n);
    for (let s = 0; s < steps; s++) {
      for (let i = 0; i < n; i++) {
        v[i] += -STIFFNESS * h[i] - DAMPING * v[i];
        h[i] += v[i];
      }
      for (let pass = 0; pass < 4; pass++) {
        for (let i = 0; i < n; i++) {
          left[i] = i > 0 ? SPREAD * (h[i] - h[i - 1]) : 0;
          right[i] = i < n - 1 ? SPREAD * (h[i] - h[i + 1]) : 0;
          if (i > 0) v[i - 1] += left[i];
          if (i < n - 1) v[i + 1] += right[i];
        }
        for (let i = 0; i < n; i++) {
          if (i > 0) h[i - 1] += left[i];
          if (i < n - 1) h[i + 1] += right[i];
        }
      }
      // Soft limit: big waves round off near the cap instead of flattening.
      for (let i = 0; i < n; i++) {
        h[i] = h[i] < 0 ? up * Math.tanh(h[i] / up) : limit * Math.tanh(h[i] / limit);
      }
    }
  }

  function drawWater() {
    const { h } = surface;
    const flat = h.every((x) => Math.abs(x) < 0.05);
    if (flat && surface.drawnFlat) return; // nothing changed
    const W = stage.clientWidth, H = stage.clientHeight, y0 = H * WATERLINE;
    waterCtx.clearRect(0, 0, W, H);
    waterCtx.fillStyle = WATER_COLOR;
    waterCtx.beginPath();
    waterCtx.moveTo(0, H);
    if (flat) {
      waterCtx.lineTo(0, y0);
      waterCtx.lineTo(W, y0);
    } else {
      // Smooth curve through the surface points.
      waterCtx.lineTo(0, y0 + h[0]);
      for (let i = 1; i < h.length; i++) {
        const x0 = (i - 1) * SPACING, x1 = i * SPACING;
        waterCtx.quadraticCurveTo(x0, y0 + h[i - 1], (x0 + x1) / 2, y0 + (h[i - 1] + h[i]) / 2);
      }
      waterCtx.lineTo(W, y0 + h[h.length - 1]);
    }
    waterCtx.lineTo(W, H);
    waterCtx.closePath();
    waterCtx.fill();
    surface.drawnFlat = flat;
  }

  // Fish moving fast near the surface stir it up, more the closer and faster they
  // are. Rushing up toward the surface pushes much harder than gliding along it, and
  // several fish arriving together add up, so a crowd makes the biggest waves.
  function stirSurface(dt) {
    const u = sizeUnit(), y0 = stage.clientHeight * WATERLINE;
    const stirs = [];
    for (const fish of fishes) {
      if (fish.prevX === undefined || dt <= 0) {
        fish.prevX = fish.x;
        fish.prevY = fish.y;
        continue;
      }
      const fw = fish.el.offsetWidth, fh = fish.el.offsetHeight;
      const vx = (fish.x - fish.prevX) / dt, vy = (fish.y - fish.prevY) / dt;
      fish.prevX = fish.x;
      fish.prevY = fish.y;
      const near = 1 - (fish.y - y0) / (fh * 0.7); // top of the head close to the waterline
      if (near <= 0) continue;
      const push = Math.max(0, -vy) * 1.0 + Math.abs(vx) * 0.3 + Math.max(0, vy) * 0.15;
      if (push < u * 0.12) continue; // idling near the top doesn't disturb the water
      stirs.push({ x: fish.x + fw / 2, amount: Math.min(4, (push / u) * near * 2.4) });
    }
    // A crowd churning the surface together makes it rougher than any one fish.
    const crowd = Math.min(2.2, 1 + 0.25 * (stirs.length - 1));
    for (const s of stirs) disturb(s.x, s.amount * crowd);
  }
  window.addEventListener("resize", applySize);

  // ---------------------------------------------------------------------------
  // Sprites: load each fish's small pre-cut frames.
  // ---------------------------------------------------------------------------

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  async function loadLook(fish) {
    const frames = await Promise.all(
      fish.frames.map((n) => loadImage(`fish/${fish.name}_${n}.webp`)));
    return { ...fish, frames };
  }

  // ---------------------------------------------------------------------------
  // Fish
  // ---------------------------------------------------------------------------

  const CHASE_SPEED = 0.9;    // top chase speed, in size units per second
  const CHOMP_FRAME_MS = 70;
  const fishes = [];

  function makeFish(look) {
    const el = document.createElement("canvas");
    el.className = "fish";
    el.width = look.frames[0].width;
    el.height = look.frames[0].height;
    el.style.width = `calc(var(--u) * ${look.width} * var(--fish-scale))`;
    stage.appendChild(el);
    const fish = {
      el,
      ctx: el.getContext("2d"),
      look,
      shown: -1,
      // Position is tracked as 0..1 within the range where the whole fish fits in the water.
      pos: { x: Math.random(), y: Math.random() },
      vel: { x: 0, y: 0 },
      target: { x: Math.random(), y: Math.random() },
      pauseUntil: 0,
      chasing: false,
      chaseVel: { x: 0, y: 0 },
      chompStart: 0,
      chompUntil: 0,
      nextBurstAt: performance.now() + 1500 + Math.random() * 8000,
      burstLeft: 0,
      appetite: null,   // how eagerly this fish goes after the current food (see wantsFood)
      dart: null,       // a short random sprint in progress
      nextDartAt: performance.now() + 20000 + Math.random() * 200000,
    };
    showFrame(fish, 0);
    fishes.push(fish);
    applySize();
    placeInFreeSpot(fish);
    return fish;
  }

  // Start a new fish somewhere it doesn't touch anyone already in the tank.
  function placeInFreeSpot(fish) {
    const b = bounds(fish);
    for (let tries = 0; tries < 60; tries++) {
      const x = b.minX + Math.random() * b.rangeX, y = b.minY + Math.random() * b.rangeY;
      const clear = fishes.every((o) => o === fish || o.x === undefined ||
        x + b.fw <= o.x || o.x + o.el.offsetWidth <= x || y + b.fh <= o.y || o.y + o.el.offsetHeight <= y);
      if (clear || tries === 59) {
        fish.pos.x = b.rangeX ? (x - b.minX) / b.rangeX : 0;
        fish.pos.y = b.rangeY ? (y - b.minY) / b.rangeY : 0;
        fish.x = x;
        fish.y = y;
        fish.bob = 0;
        fish.el.style.transform = `translate(${x}px, ${y}px)`;
        return;
      }
    }
  }

  // Soft spacing: heads may overlap at the edges and jostle, but their cores
  // (the middle of each head) push each other apart, so they can't pile up in one
  // spot. The push is gradual, so a crowd around food visibly shoves.
  const CORE = 0.8;    // share of each head's width/height that resists overlap
  const SHOVE = 0.6;   // how much of a core overlap is pushed out each frame
  function separate() {
    const boxes = fishes.map((f) => ({ f, b: bounds(f) }));
    const core = ({ f, b }) => {
      const iw = b.fw * CORE, ih = b.fh * CORE;
      return { x: f.x + (b.fw - iw) / 2, y: f.y + (b.fh - ih) / 2, w: iw, h: ih };
    };
    for (let i = 0; i < boxes.length; i++) {
      for (let j = i + 1; j < boxes.length; j++) {
        const A = boxes[i], B = boxes[j], a = A.f, c = B.f;
        const p = core(A), q = core(B);
        const ox = Math.min(p.x + p.w, q.x + q.w) - Math.max(p.x, q.x);
        const oy = Math.min(p.y + p.h, q.y + q.h) - Math.max(p.y, q.y);
        if (ox <= 0 || oy <= 0) continue;
        // Push along the shallower overlap. Fish going after food push past ones that
        // aren't, and one closing in on its bite holds its ground; equals split it.
        const rank = (f) => (f.chasing ? 1 : 0) + (f.closingIn ? 1 : 0);
        const sa = rank(a) === rank(c) ? 0.5 : rank(a) > rank(c) ? 0 : 1;
        const sc = 1 - sa;
        if (ox < oy) {
          const dir = p.x + p.w / 2 < q.x + q.w / 2 ? -1 : 1;
          a.x += dir * ox * SHOVE * sa;
          c.x -= dir * ox * SHOVE * sc;
        } else {
          const dir = p.y + p.h / 2 < q.y + q.h / 2 ? -1 : 1;
          a.y += dir * oy * SHOVE * sa;
          c.y -= dir * oy * SHOVE * sc;
        }
        for (const { f, b } of [A, B]) {
          f.x = Math.min(b.minX + b.rangeX, Math.max(b.minX, f.x));
          f.y = Math.min(b.minY + b.rangeY, Math.max(b.minY, f.y));
        }
      }
    }
    // Write the settled positions back and draw.
    for (const { f, b } of boxes) {
      f.pos.x = b.rangeX ? Math.min(1, Math.max(0, (f.x - b.minX) / b.rangeX)) : 0;
      f.pos.y = b.rangeY ? Math.min(1, Math.max(0, (f.y - b.minY - f.bob) / b.rangeY)) : 0;
      f.el.style.transform = `translate(${f.x}px, ${f.y}px)`;
    }
  }

  function showFrame(fish, i) {
    if (i === fish.shown) return;
    fish.ctx.clearRect(0, 0, fish.el.width, fish.el.height);
    fish.ctx.drawImage(fish.look.frames[i], 0, 0);
    fish.shown = i;
  }

  // The whole fish stays in the water: full width, from the waterline to the bottom.
  function bounds(fish) {
    const W = stage.clientWidth, H = stage.clientHeight;
    const size = fish.el.getBoundingClientRect(); // exact (fractional) on-screen size
    const fw = size.width, fh = size.height;
    const minY = H * WATERLINE + maxWave(); // below the lowest a wave can dip
    return { minX: 0, minY, rangeX: Math.max(0, W - fw), rangeY: Math.max(0, H - fh - minY), fw, fh };
  }

  // Not every fish is equally keen. Each time food shows up, every fish rolls an
  // appetite: most go right away, a few straggle in late and slower, and now and
  // then one daydreams. Even eager fish get briefly distracted once in a while.
  function wantsFood(fish, now, dt) {
    if (!flakes.some(edible)) {
      fish.appetite = null;
      return false;
    }
    if (!fish.appetite) {
      const roll = Math.random();
      fish.appetite =
        roll < 0.75 ? { start: now + Math.random() * 300, speed: 0.9 + Math.random() * 0.25 }
        : roll < 0.92 ? { start: now + 1000 + Math.random() * 1500, speed: 0.6 + Math.random() * 0.2 }
        : { start: now + 2500 + Math.random() * 2500, speed: 0.5 + Math.random() * 0.2 };
    }
    if (now >= fish.appetite.start && Math.random() < dt * 0.08) {
      fish.appetite.start = now + 500 + Math.random() * 700; // got distracted
    }
    return now >= fish.appetite.start;
  }

  function moveFish(fish, now, dt) {
    const b = bounds(fish);
    const { look, pos, vel } = fish;

    // Food in the water takes priority: swim so the mouth lines up with the nearest flake.
    const prey = wantsFood(fish, now, dt) ? nearestFlake(fish, b) : null;
    if (prey) {
      const cx = b.minX + pos.x * b.rangeX, cy = b.minY + pos.y * b.rangeY;
      const gx = Math.min(b.minX + b.rangeX, Math.max(b.minX, prey.cx - look.mouthX * b.fw));
      const gy = Math.min(b.minY + b.rangeY, Math.max(b.minY, prey.cy - look.mouthY * b.fh));
      const dx = gx - cx, dy = gy - cy, dist = Math.hypot(dx, dy);
      // Within about a head's width of the food, hold ground in the crowd (see separate).
      fish.closingIn = dist < b.fw;
      // Head over at a steady pace, easing in at the end so they don't overshoot.
      const speed = Math.min(sizeUnit() * CHASE_SPEED * fish.appetite.speed, dist * 5);
      const want = dist > 0.01 ? { x: (dx / dist) * speed, y: (dy / dist) * speed } : { x: 0, y: 0 };
      const turn = 1 - Math.pow(0.002, dt);
      fish.chaseVel.x += (want.x - fish.chaseVel.x) * turn;
      fish.chaseVel.y += (want.y - fish.chaseVel.y) * turn;
      pos.x = b.rangeX ? Math.min(1, Math.max(0, (cx + fish.chaseVel.x * dt - b.minX) / b.rangeX)) : 0;
      pos.y = b.rangeY ? Math.min(1, Math.max(0, (cy + fish.chaseVel.y * dt - b.minY) / b.rangeY)) : 0;
      // Carry the momentum over for when they go back to wandering.
      vel.x = b.rangeX ? fish.chaseVel.x / b.rangeX : 0;
      vel.y = b.rangeY ? fish.chaseVel.y / b.rangeY : 0;
      fish.chasing = true;
      fish.pauseUntil = 0;
      fish.dart = null;
    } else {
      fish.closingIn = false;
      if (fish.chasing) {
        fish.chasing = false;
        fish.target = { x: Math.random(), y: Math.random() };
      }
      fish.chaseVel.x = vel.x * b.rangeX;
      fish.chaseVel.y = vel.y * b.rangeY;

      // Every so often, a sudden short sprint in a random (mostly sideways) direction.
      if (!fish.dart && now >= fish.nextDartAt) {
        const angle = (Math.random() < 0.5 ? 0 : Math.PI) + (Math.random() - 0.5) * 1.2;
        const burst = sizeUnit() * (1.6 + Math.random() * 0.8);
        fish.dart = { until: now + 400 + Math.random() * 400, vx: Math.cos(angle) * burst, vy: Math.sin(angle) * burst };
        fish.nextDartAt = now + 120000 + Math.random() * 150000; // rare: every 2-4.5 minutes per fish
      }
      if (fish.dart) {
        const cx = b.minX + pos.x * b.rangeX, cy = b.minY + pos.y * b.rangeY;
        let nx = cx + fish.dart.vx * dt, ny = cy + fish.dart.vy * dt;
        // Bounce off the tank edges instead of sticking to them.
        if (nx < b.minX || nx > b.minX + b.rangeX) { fish.dart.vx *= -1; nx = cx; }
        if (ny < b.minY || ny > b.minY + b.rangeY) { fish.dart.vy *= -1; ny = cy; }
        pos.x = b.rangeX ? (nx - b.minX) / b.rangeX : 0;
        pos.y = b.rangeY ? (ny - b.minY) / b.rangeY : 0;
        // Ease out of the sprint.
        const ease = Math.pow(0.15, dt);
        fish.dart.vx *= ease;
        fish.dart.vy *= ease;
        vel.x = b.rangeX ? fish.dart.vx / b.rangeX : 0;
        vel.y = b.rangeY ? fish.dart.vy / b.rangeY : 0;
        if (now >= fish.dart.until) {
          fish.dart = null;
          fish.target = { x: Math.random(), y: Math.random() };
        }
      } else if (now > fish.pauseUntil) {
        // Ease toward the current target, with gentle damping.
        vel.x = (vel.x + (fish.target.x - pos.x) * 0.9 * dt) * Math.pow(0.35, dt);
        vel.y = (vel.y + (fish.target.y - pos.y) * 0.9 * dt) * Math.pow(0.35, dt);
        pos.x = Math.min(1, Math.max(0, pos.x + vel.x * dt));
        pos.y = Math.min(1, Math.max(0, pos.y + vel.y * dt));
        if (Math.hypot(fish.target.x - pos.x, fish.target.y - pos.y) < 0.05) {
          fish.target = { x: Math.random(), y: Math.random() };
          // Occasionally linger for a moment, like a fish idling.
          if (Math.random() < 0.35) fish.pauseUntil = now + 600 + Math.random() * 1400;
        }
      }
    }

    // Small bob, kept inside the water by shrinking the travel range.
    const bob = Math.sin(now / 700 + fish.look.mouthX * 10) * Math.min(8, b.rangeY * 0.02);
    fish.x = b.minX + pos.x * b.rangeX;
    fish.y = b.minY + Math.min(b.rangeY, Math.max(0, pos.y * b.rangeY + bob));
    fish.bob = fish.y - (b.minY + pos.y * b.rangeY);
    // Drawn after separate() makes sure nobody overlaps.
  }

  // Chomp: cycle the jaw frames while eating, then back to the normal face.
  function chomp(fish, now, ms) {
    if (now >= fish.chompUntil) fish.chompStart = now;
    fish.chompUntil = Math.max(fish.chompUntil, now + ms);
  }

  function updateFace(fish, now) {
    if (now < fish.chompUntil) {
      const seq = fish.look.chomp;
      const step = Math.floor(Math.max(0, now - fish.chompStart) / CHOMP_FRAME_MS);
      showFrame(fish, seq[step % seq.length]);
    } else {
      showFrame(fish, 0);
    }
  }

  // ---------------------------------------------------------------------------
  // Bubbles: each fish sends up a burst every so often, then they fade away.
  // Units are background-image px, so they scale with the scene.
  // ---------------------------------------------------------------------------

  const BUBBLE = 76;          // diameter, same as the bubbles in background.png
  const RISE = 380;           // upward speed, image px per second
  const bubbles = [];

  function spawnBubble(fish, s) {
    const el = document.createElement("div");
    el.className = "bubble";
    stage.insertBefore(el, stage.querySelector(".fish")); // behind the fish
    const jitter = (Math.random() - 0.5) * BUBBLE * 0.6;
    bubbles.push({
      el,
      x: (fish.x + fish.look.headTopX * fish.el.offsetWidth) / s - BUBBLE / 2 + jitter,
      y: fish.y / s - BUBBLE * 1.15,
      age: 0,
      life: 2.2 + Math.random() * 1.2,
      tone: Math.random() < 0.5 ? 1 : 0.5, // solid white or the lighter 50% bubble
      wobble: 2.2 + Math.random(),
      phase: Math.random() * Math.PI * 2,
    });
  }

  function scheduleBubbles(fish, now, s, waterTop) {
    // A burst of 2-4 bubbles, spaced out, then a longer pause (it's a busy tank).
    const roomAbove = fish.y / s - BUBBLE * 1.15 - waterTop > BUBBLE * 2;
    if (now >= fish.nextBurstAt && roomAbove) {
      if (fish.burstLeft === 0) fish.burstLeft = 2 + Math.floor(Math.random() * 3);
      spawnBubble(fish, s);
      fish.burstLeft--;
      fish.nextBurstAt = now + (fish.burstLeft > 0 ? 180 + Math.random() * 220 : 6000 + Math.random() * 9000);
    }
  }

  function updateBubbles(dt, s, waterTop) {
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const bub = bubbles[i];
      bub.age += dt;
      bub.y -= RISE * dt;
      const t = bub.age / bub.life;
      const fadeIn = Math.min(1, bub.age / 0.25);
      const fadeOut = 1 - Math.min(1, Math.max(0, (t - 0.45) / 0.55));
      // Disappear before reaching the waterline.
      const surface = Math.min(1, Math.max(0, (bub.y - waterTop) / (BUBBLE * 2)));
      if (t >= 1 || surface <= 0) {
        bub.el.remove();
        bubbles.splice(i, 1);
        continue;
      }
      const wx = Math.sin(bub.age * bub.wobble + bub.phase) * BUBBLE * 0.18;
      bub.el.style.opacity = (bub.tone * fadeIn * fadeOut * surface).toFixed(3);
      bub.el.style.transform = `translate(${(bub.x + wx) * s}px, ${bub.y * s}px)`;
    }
  }

  // ---------------------------------------------------------------------------
  // Food flakes: tap anywhere to sprinkle a few; they fall, then sink.
  // ---------------------------------------------------------------------------

  const FLAKE_COLORS = ["#f6b26b", "#eb9a5c"];
  const GRAVITY = 2600;       // in the air
  const MAX_FLAKES = 150;
  const flakes = [];

  function sprinkle(clientX, clientY) {
    const s = scale();
    const rect = stage.getBoundingClientRect();
    const cx = (clientX - rect.left) / s, cy = (clientY - rect.top) / s;
    const count = 6 + Math.floor(Math.random() * 4);
    for (let i = 0; i < count && flakes.length < MAX_FLAKES; i++) {
      const el = document.createElement("div");
      el.className = "flake";
      el.style.background = FLAKE_COLORS[i % FLAKE_COLORS.length];
      stage.insertBefore(el, stage.querySelector(".fish")); // food passes behind the fish
      flakes.push({
        el,
        x: cx + (Math.random() - 0.5) * 140,
        y: cy + (Math.random() - 0.5) * 80,
        vx: (Math.random() - 0.5) * 260,
        vy: -120 + Math.random() * 200,
        rot: Math.random() * 360,
        spin: (Math.random() - 0.5) * 240,
        size: 0.8 + Math.random() * 0.5,
        sink: 110 + Math.random() * 80,      // settled sinking speed in water
        sway: 18 + Math.random() * 26,
        swayRate: 1.4 + Math.random() * 1.2,
        phase: Math.random() * Math.PI * 2,
        waterAge: -1,                         // seconds since entering the water
        life: 6 + Math.random() * 4,          // seconds in the water before fading
        restAge: -1,                          // seconds since landing on the bottom
      });
    }
  }

  function updateFlakes(dt, s, waterTop) {
    const floor = stage.clientHeight / s - 24;
    for (let i = flakes.length - 1; i >= 0; i--) {
      const f = flakes[i];
      if (f.eaten) {
        // Quick shrink-and-vanish where it was caught.
        f.eatAge += dt;
        const k = 1 - f.eatAge / 0.18;
        if (k <= 0) {
          f.el.remove();
          flakes.splice(i, 1);
        } else {
          f.el.style.opacity = k.toFixed(3);
          f.el.style.transform = `${f.lastTranslate} rotate(${f.rot}deg) scale(${f.size * k})`;
        }
        continue;
      }
      let sway = 0;
      if (f.y < waterTop) {
        // Falling through the air.
        f.vy += GRAVITY * dt;
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.rot += f.spin * dt;
      } else if (f.restAge < 0) {
        // In the water: drag pulls toward a slow sink, with a gentle side-to-side drift.
        if (f.waterAge < 0) {
          f.waterAge = 0;
          disturb((f.x + 15) * s, 0.29); // just a small ripple where it lands
        }
        f.waterAge += dt;
        const drag = 1 - Math.pow(0.02, dt);
        f.vy += (f.sink - f.vy) * drag;
        f.vx += (0 - f.vx) * drag;
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.rot += f.spin * 0.25 * dt;
        sway = Math.sin(f.waterAge * f.swayRate + f.phase) * f.sway;
        if (f.y >= floor) { f.y = floor; f.restAge = 0; }
      } else {
        f.restAge += dt; // resting on the bottom
      }

      let opacity = 1;
      if (f.restAge >= 0) opacity = 1 - f.restAge / 1.5;
      else if (f.waterAge > f.life) opacity = 1 - (f.waterAge - f.life) / 1.2;
      if (opacity <= 0) {
        f.el.remove();
        flakes.splice(i, 1);
        continue;
      }
      f.opacity = opacity;
      f.lastTranslate = `translate(${(f.x + sway) * s}px, ${f.y * s}px)`;
      // Screen-space center (the flake is 30 x 22 image px), used for chasing and eating.
      f.cx = (f.x + sway + 15) * s;
      f.cy = (f.y + 11) * s;
      f.el.style.opacity = opacity.toFixed(3);
      f.el.style.transform = `${f.lastTranslate} rotate(${f.rot}deg) scale(${f.size})`;
    }
  }

  // Flakes a fish can go after: in the water, not yet eaten, and still clearly visible.
  const edible = (f) => !f.eaten && f.waterAge >= 0 && f.cx !== undefined && f.opacity > 0.25;

  function nearestFlake(fish, b) {
    const mx = b.minX + fish.pos.x * b.rangeX + fish.look.mouthX * b.fw;
    const my = b.minY + fish.pos.y * b.rangeY + fish.look.mouthY * b.fh;
    let best = null, bestDist = Infinity;
    for (const f of flakes) {
      if (!edible(f)) continue;
      const dist = Math.hypot(f.cx - mx, f.cy - my);
      if (dist < bestDist) { bestDist = dist; best = f; }
    }
    return best;
  }

  function eatNearbyFlakes(fish, now) {
    const fw = fish.el.offsetWidth, fh = fish.el.offsetHeight;
    const mx = fish.x + fish.look.mouthX * fw, my = fish.y + fish.look.mouthY * fh;
    const reach = Math.max(8, fw * 0.15);
    for (const f of flakes) {
      if (!edible(f)) continue;
      const dist = Math.hypot(f.cx - mx, f.cy - my);
      if (dist < reach) {
        f.eaten = true;
        f.eatAge = 0;
        chomp(fish, now, 450);   // keep chewing for a moment after each bite
        recordBite(fish, now);
      } else if (dist < fw * 1.2) {
        chomp(fish, now, 120);   // start chomping as food gets close
      }
    }
  }

  const tapDemo = document.getElementById("tap-demo");
  stage.addEventListener("pointerdown", (event) => {
    if (!reduceMotion) sprinkle(event.clientX, event.clientY);
    // They've got it: fade the tap demo out for good.
    if (tapDemo) {
      tapDemo.classList.add("is-done");
      setTimeout(() => tapDemo.remove(), 700);
    }
  });

  // ---------------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------------

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    const s = scale();
    const waterTop = (stage.clientHeight * WATERLINE) / s; // in image px

    for (const fish of fishes) moveFish(fish, now, dt);
    separate();
    stirSurface(dt);
    updateSurface(dt);
    drawWater();
    for (const fish of fishes) {
      eatNearbyFlakes(fish, now);
      updateFace(fish, now);
      scheduleBubbles(fish, now, s, waterTop);
    }
    updateBubbles(dt, s, waterTop);
    updateFlakes(dt, s, waterTop);
    requestAnimationFrame(tick);
  }

  // Load everyone at once (the sprites are small); each fish is placed in a free
  // spot as soon as its frames arrive.
  function start() {
    applySize();
    if (!reduceMotion) requestAnimationFrame(tick);
    for (const fish of FISH) {
      loadLook(fish)
        .then(makeFish)
        .catch((err) => console.error(`Could not load ${fish.name}`, err));
    }
  }
  start();
</script>
</body>
</html>
